name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate POSIX bootstrap syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh && sh -n scripts/update.sh
      - name: Validate PowerShell bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content scripts/install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/update.ps1 -Raw))
