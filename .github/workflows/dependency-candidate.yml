name: Dependency candidate

# Monday half of the unattended weekly dependency promotion.
#
# Resolves the latest registry versions, promotes every changed package into
# catalog/stack.lock.json on automation/dependency-candidate, and runs the full
# promotion verification against that commit. A green run leaves a
# `verified-candidate` artifact naming the commit; auto-promote.yml lands it on
# main on Wednesday. A red run leaves no artifact, so nothing is promoted and
# GitHub sends the failure notification.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-promotion
  cancel-in-progress: false

jobs:
  stage:
    name: Stage promotion commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.promote.outputs.changed }}
      summary: ${{ steps.promote.outputs.summary }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve registry versions into the candidate lock
        run: node dist/src/cli.js update --stage --apply
      - name: Promote changed packages into the stable lock
        id: promote
        run: node scripts/auto-promote.mjs stage
      - name: Push the promotion commit to the candidate branch
        id: push
        if: steps.promote.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.promote.outputs.summary }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/dependency-candidate
          git add catalog/stack.lock.json catalog/candidate.lock.json
          git commit -m "chore(deps): promote $SUMMARY"
          git push --force origin HEAD:automation/dependency-candidate
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: stage
    if: needs.stage.outputs.changed == 'true'
    uses: ./.github/workflows/promotion-verify.yml
    with:
      ref: ${{ needs.stage.outputs.sha }}

  record:
    name: Record verified candidate
    needs: [stage, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Write the verified commit and summary
        env:
          SHA: ${{ needs.stage.outputs.sha }}
          SUMMARY: ${{ needs.stage.outputs.summary }}
        shell: bash
        run: |
          mkdir verified
          printf '%s\n' "$SHA" > verified/sha.txt
          printf '%s\n' "$SUMMARY" > verified/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-candidate
          path: verified/
          retention-days: 14
          if-no-files-found: error
