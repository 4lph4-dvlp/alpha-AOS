name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Authoritative Release Package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:check
      - name: Pack authoritative release tarball
        run: npm pack
      - name: Audit tarball contents against allowlist
        run: node scripts/audit-tarball.mjs alpha-aos-0.1.0.tgz
      - name: Generate SHA-256 checksum
        run: >
          node -e "const fs=require('node:fs'),crypto=require('node:crypto'),file='alpha-aos-0.1.0.tgz';
          const digest=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          fs.writeFileSync(file+'.sha256',digest+'  '+file+'\n');"
      - name: Upload release tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: |
            alpha-aos-0.1.0.tgz
            alpha-aos-0.1.0.tgz.sha256
          if-no-files-found: error

  test:
    name: ${{ matrix.os }} / Node 24
    needs: package
    runs-on: ${{ matrix.os }}
    # These three pinned-server startups are the repository's only
    # registry-touching tests. Without this gate an air-gapped leg would lose
    # the Pitfall 8 firecrawl regression and still report green. A transient
    # upstream fault showing red is the accepted cost already recorded in
    # pack-skill-drift.yml.
    env:
      ALPHA_AOS_REQUIRE_UPSTREAM_MCP: "1"
      ALPHA_AOS_RELEASE_TARBALL: ${{ github.workspace }}/alpha-aos-0.1.0.tgz
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download release tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: release-tarball
      - name: Verify release tarball checksum with Node.js
        run: >
          node -e "const fs=require('node:fs'),crypto=require('node:crypto'),file='alpha-aos-0.1.0.tgz';
          const expected=fs.readFileSync(file+'.sha256','utf8').trim().split(/\s+/u)[0].toLowerCase();
          const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          if(actual!==expected)throw new Error('Checksum mismatch: expected '+expected+', got '+actual);"
      - run: npm run check
      - run: npm test

      # The artifact `npm test` just built must describe itself exactly. A
      # mismatch here means the build is not reproducible from these sources,
      # which is the one prerequisite every wrapper depends on.
      - name: Verify the build artifact manifest
        run: npm run build:check

      # The Phase 1 safety boundary, exercised per OS rather than assumed.
      # Each file is named so a suite that silently stops running is a failure
      # rather than an omission nobody notices.
      # It goes through scripts/run-tests.mjs so this step observes the same
      # environment the primary `npm test` gate does. Reverting it to a bare
      # `node --test` reinstates RC-5: the windows-latest image sets
      # `npm_config_prefix` at machine scope, and in run 33984247757 that made
      # this step fail the runner-environment invariant inside a job whose
      # `npm test` step reported fail 0 on the very same compiled files.
      - name: Safety boundary suites
        run: >
          node scripts/run-tests.mjs --files
          dist/test/preview.test.js
          dist/test/path-boundary.test.js
          dist/test/transaction-crash.test.js
          dist/test/redaction.test.js
          dist/test/validation.test.js
          dist/test/process.test.js
          dist/test/protocol-session.test.js
          dist/test/mcp-proxy.test.js
          dist/test/install.test.js
          dist/test/update.test.js

      # Wrapper behaviour is asserted inside preview.test.js above, which runs
      # each family natively on this OS and records a not-run entry rather
      # than a pass when a launcher is unavailable. These steps only prove the
      # scripts still parse under the interpreter this OS ships.
      - name: Validate POSIX wrapper syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh && sh -n scripts/update.sh
      - name: Validate PowerShell wrapper syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content scripts/install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/update.ps1 -Raw))
