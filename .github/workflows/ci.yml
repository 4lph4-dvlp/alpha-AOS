name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

      # The artifact `npm test` just built must describe itself exactly. A
      # mismatch here means the build is not reproducible from these sources,
      # which is the one prerequisite every wrapper depends on.
      - name: Verify the build artifact manifest
        run: npm run build:check

      # The Phase 1 safety boundary, exercised per OS rather than assumed.
      # Each file is named so a suite that silently stops running is a failure
      # rather than an omission nobody notices.
      # It goes through scripts/run-tests.mjs so this step observes the same
      # environment the primary `npm test` gate does. Reverting it to a bare
      # `node --test` reinstates RC-5: the windows-latest image sets
      # `npm_config_prefix` at machine scope, and in run 33984247757 that made
      # this step fail the runner-environment invariant inside a job whose
      # `npm test` step reported fail 0 on the very same compiled files.
      - name: Safety boundary suites
        run: >
          node scripts/run-tests.mjs --files
          dist/test/preview.test.js
          dist/test/path-boundary.test.js
          dist/test/transaction-crash.test.js
          dist/test/redaction.test.js
          dist/test/validation.test.js
          dist/test/process.test.js
          dist/test/protocol-session.test.js
          dist/test/mcp-proxy.test.js
          dist/test/install.test.js
          dist/test/update.test.js

      # Wrapper behaviour is asserted inside preview.test.js above, which runs
      # each family natively on this OS and records a not-run entry rather
      # than a pass when a launcher is unavailable. These steps only prove the
      # scripts still parse under the interpreter this OS ships.
      - name: Validate POSIX wrapper syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh && sh -n scripts/update.sh
      - name: Validate PowerShell wrapper syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content scripts/install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/update.ps1 -Raw))
