schemaVersion: 1
packs:
  - id: SECURITY_REVIEW
    evidence:
      # The eight risk facts are change-risk semantics rather than repository
      # state, and carry `deferredTo: GATE-01` in catalog/facts.yaml, so the
      # pack reports `unimplemented` naming them rather than staying silent.
      # The manifest opt-in is the branch that IS operative in this phase.
      any:
        - { manifestOptIn: securityReview }
        - auth-change
        - user-input
        - secrets
        - payments
        - sensitive-data
        - command-execution
        - trust-boundary
        - public-api
    selectionPolicy: prefer-native-single-engine
    skills: [security-review]
