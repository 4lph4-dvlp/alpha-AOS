# The declared canary prompts.
#
# Every prompt a canary run may put in front of a model lives here, in ordinary
# text, reviewable before any run spends anything. A prompt NEVER names the
# skill, the MCP server or the tool it is meant to elicit — that is what the
# expectation lists below are for, and the separation is what makes the
# no-rewording prohibition enforceable instead of aspirational. A prompt that
# only works once it hints is a finding about discovery, not a prompt to revise.
#
# Contract: schemas/canary-catalog.schema.json (closed world).
#
# Expectation lists are FINAL as of plan 03-08 and were checked, name by name,
# against `MEASURED_UPSTREAM_TOOLS` in src/core/mcp-proxy.ts — live `tools/list`
# results, not against any document that describes those servers. The pinned
# third-party research instructions (`ecc-universal@2.2.1`
# `skills/deep-research/SKILL.md`) name two tools no pinned server publishes and
# one the alpha-AOS proxy denies; that disagreement is recorded as the finding
# ECC_RESEARCH_ROUTING_CONTRACT_MISMATCH and is reconciled in
# skills/alpha-aos-research-routing/SKILL.md rather than by widening the
# allowlist. Plan 03-07 recorded that decision as option `narrow`.
schemaVersion: 1
canaries:
  - id: DOCUMENTATION_VERSION_SCOPED
    capability: CAPA-01
    why: >-
      A version-sensitive question should be answered from a documentation source
      resolved to the exact version asked about, rather than from recall. The
      structural proof is the identifier the second call carries.
    prompt: >-
      I'm on Next.js 16.2.2 and need a route handler that streams its response.
      What does the current API look like on that exact version, and what changed
      from 15?
    expectTools:
      - resolve-library-id
      - query-docs
    expectOrdered: true
    expectArgumentPatterns:
      - tool: query-docs
        argument: libraryId
        pattern: "^/[^/]+/[^/]+/[^/]+$"
        why: >-
          A three-segment identifier is version-scoped; a two-segment one is not.
          This is a structural fact about the call, not a judgement of the answer.
    forbidTools: []
    maxDistinctServers: 1
    requiresEnvironment: []
    requiresMcpServers:
      - context7
    harnesses:
      - claude
      - codex
    readOnly: true

  - id: RESEARCH_MULTI_SOURCE
    capability: CAPA-02
    why: >-
      Finding candidate sources and extracting one of them in full are different
      jobs, and the stack has a different server for each. The expectation is that
      both legs happen, in that order.
    prompt: >-
      Find the two or three most credible recent write-ups on how Node.js 24
      changed its permission model, then pull the full text of the best one so I
      can quote it accurately.
    expectTools:
      - web_search_exa
      - firecrawl_scrape
    expectOrdered: true
    forbidTools:
      - firecrawl_search
    maxDistinctServers: 2
    requiresEnvironment:
      - EXA_API_KEY
    requiresMcpServers:
      - exa
      - firecrawl
    harnesses:
      - claude
      - codex
    readOnly: true

  - id: PACK_EXERCISE_FRONTEND_A11Y
    capability: CAPA-05
    why: >-
      The representative project pack (WEB_REACT) supplies exactly one skill, and
      an ordinary complaint about a form that a keyboard and a screen reader
      cannot get through is the natural thing that skill is for. The prompt names
      neither the skill nor any tool, so selecting it is the harness's own act —
      which is the whole of what CAPA-05 asks about "used during relevant work".
      Note what this declaration does NOT assert: a pack skill is not an MCP tool,
      so MCP-side observation cannot see it being followed. The structural
      expectation here is the fan-out bound; that the skill was actually SELECTED
      is read from the harness's own event stream on a deliberate paid run, and
      the free half — that the skill is discoverable inside the project and not
      outside it — is the paired discovery unit in test/capability-oracle.test.ts.
    prompt: >-
      Our checkout form works fine with a mouse, but a customer told us they
      cannot get through it with the keyboard alone and that nothing useful is
      announced to them as they move between the fields. Go through the form and
      tell me what to fix.
    expectTools: []
    forbidTools: []
    maxDistinctServers: 1
    requiresEnvironment: []
    requiresMcpServers: []
    harnesses:
      - claude
      - codex
    readOnly: true

  - id: CROSS_HARNESS_HANDOFF
    capability: CAPA-03
    why: >-
      One run, both halves. The positive is that a handoff written by one harness
      and addressed to another is really there and really recallable under the
      receiving harness's own filter; the negative is that the project's planning
      tree is byte-for-byte what it was before the round trip — memory did not
      become authoritative project policy. The prompt names no tool, no server
      and no skill: it is the ordinary thing someone says when picking up work a
      colleague left mid-task, and consulting the handed-off context is the
      receiving harness's own act. Note what this declaration does NOT assert.
      A vault recall is not an MCP tool call, so MCP-side observation cannot see
      one; the structural expectation here is the fan-out bound. That the
      receiving run genuinely WORKED from the handed-off context rather than
      answering from general knowledge that happens to agree is a judgement no
      test can make, and it is recorded as a human check rather than computed.
      alpha-AOS proves the planning tree unchanged; it does not police the memory
      tool's other filesystem access, because doing that would require being an
      invocation proxy for every tool call.
    prompt: >-
      A teammate handed this over to me mid-task and left their notes behind for
      whoever picked it up next. Work out what they had already decided and tell
      me the next step they intended, before you suggest anything of your own.
    expectTools: []
    forbidTools: []
    maxDistinctServers: 1
    requiresEnvironment: []
    requiresMcpServers: []
    harnesses:
      - claude
      - codex
    readOnly: true

  - id: ORDINARY_LOOKUP_CONTROL
    capability: CAPA-02
    why: >-
      The fan-out negative. An ordinary one-fact question must not sweep the whole
      research stack. Declared as a count of distinct research servers touched
      rather than as a required tool sequence, because more than one reasonable
      two-tool path exists.
    prompt: >-
      What port does a Vite dev server listen on by default?
    expectTools: []
    forbidTools: []
    maxDistinctServers: 1
    requiresEnvironment: []
    requiresMcpServers: []
    harnesses:
      - claude
      - codex
    readOnly: true
