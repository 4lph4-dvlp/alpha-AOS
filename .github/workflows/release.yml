name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New package version; existing tags are never overwritten.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and confirm CLI starts
        run: |
          npm run build
          node dist/src/cli.js --help
      - name: Package and publish without CI prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          tag="v$RELEASE_VERSION"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "Tag already exists; use a new package version."
            exit 1
          fi
          npm pack --ignore-scripts
          file="alpha-aos-$RELEASE_VERSION.tgz"
          sha256sum "$file" > "$file.sha256"
          printf 'Source: %s\n\nManual build; tests and cross-platform CI were not run.\n' "$GITHUB_SHA" > release-notes.md
          gh release create "$tag" "$file" "$file.sha256" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md
